</style></head><body><main><h1>HOD102 - Ôn tập tổng hợp</h1><p class="sub" id="progress"></p><section class="card"><div class="meta" id="meta"></div><div id="qtext"></div><div id="images"></div><div class="opts" id="opts"></div><div class="feedback" id="feedback"></div><div class="study-note" id="study-note"><h3>Giải thích</h3><p id="explanation"></p><p class="keyword-list">Keywords dễ nhớ:</p><div id="keywords"></div></div></section><div class="nav"><button id="prev">Câu trước</button><label class="jump">Đi đến câu <input id="jump" type="number" min="1" max="547"></label><button id="next">Câu tiếp theo</button></div><button id="reset">Làm lại câu hiện tại</button></main><script id="question-data" type="application/json">[{"source": "HOD102 - BO SUNG FALL 24", "original_number": "1", "question": "What characterized the international style that emerged during the fin-de-siècle period (1890-1914)?", "options": [{"label": "A", "text": "Slavish historical revivalism"}, {"label": "B", "text": "Natural forms and folk-inspired vernacularism"}, {"label": "C", "text": "Neo-Classical influences"}, {"label": "D", "text": "Rococo-inspired designs"}], "correct": ["B"], "images": [], "number": 1, "explanation": "Đáp án này phù hợp nhất vì nội dung “Natural forms and folk-inspired vernacularism” trực tiếp trả lời đúng trọng tâm của câu hỏi, trong khi các lựa chọn còn lại thuộc thời kỳ, nhân vật hoặc đặc trưng khác.", "keywords": ["characterized", "international", "emerged", "fin-de-siècle"]}, {"source": "HOD102 - BO SUNG FALL 24", "original_number": "2", "question": "Which design style is described in the following sentence? “During this heady time, many designers took motifs directly from nature-a furling leaf, a peacock feather, a blossoming rose-and dramatically stylized them in designs that invoked dynamic, swirling growth”.", "options": [{"label": "A", "text": "Organic design"}, {"label": "B", "text": "Art Nouveau"}, {"label": "C", "text": "Rococo"}, {"label": "D", "text": "Aesthetic Movement"}], "correct": ["B"], "images": [], "number": 2, "explanation": "Art Nouveau dùng đường cong uốn lượn, mô-típ thực vật, hoa lá và cảm hứng từ tự nhiên; ở Đức gọi là Jugendstil, ở Ý gọi là Stile Liberty.", "keywords": ["Art Nouveau", "nature", "whiplash line"]}, {"source": "HOD102 - BO SUNG FALL 24", "original_number": "3", "question": "Choose the CORRECT statement about: One of the best surviving examples of Horta's work is his Hotel Tassel (1893-94), a Gesamtkunstwerk town house built for the Belgian scientist Emile Tassel, generally regarded as the first true Art Nouveau building.", "options": [{"label": "A", "text": "The residence was groundbreaking in its use of a steel-and glass roof that bathed its stairwell core in warm, golden light and the writhing, decorative floral motifs in its staircase, which incorporated structural columns and integrated lighting fixtures to dramatic effect. 2"}, {"label": "B", "text": "The residence is groundbreaking in its use of steel and glass roofs, bathing the stair core in warm golden light and abstract motifs on the stairs, incorporating structural columns and integrated lighting fixtures to create impressive effects."}, {"label": "C", "text": "The residence is groundbreaking in its use of steel and glass roofs, bathing the stair core in warm golden light and heavy geometric patterns on the stairs, incorporating structural columns and integrated lighting fixtures. to create dramatic effects."}, {"label": "D", "text": "None of these answers"}], "correct": ["A"], "images": [], "number": 3, "explanation": "Art Nouveau dùng đường cong uốn lượn, mô-típ thực vật, hoa lá và cảm hứng từ tự nhiên; ở Đức gọi là Jugendstil, ở Ý gọi là Stile Liberty. Vì vậy lựa chọn đúng là “The residence was groundbreaking in its use of a steel-and glass roof that bathed its stairwell core in warm, golden light and the writhing, decorative floral motifs in its staircase, which incorporated structural columns and integrated lighting fixtures to dramatic effect. 2”.", "keywords": ["Art Nouveau", "nature", "whiplash line"]}, {"source": "HOD102 - BO SUNG FALL 24", "original_number": "4", "question": "Choose the CORRECT statement about: Gaudi used broken tiles as well as old cups and saucers to dress the undulating bench that wraps the development's elevated main plaza, producing a colorful scale-like mosaic effect that was unlike anything that had been produced before.", "options": [{"label": "A", "text": "Here is the frantic desire for the unprecedented; here the faith in the creative individual, here the delight of the arbitrary curve, and here the keen interest in the possibilities of materials"}, {"label": "B", "text": "Beyond Western Art Nouveau, and yet can only be understood within the terms of that short-lived style."}, {"label": "C", "text": "It was playful \"art for art's sake\" on an unprecedented public scale."}, {"label": "D", "text": "All of the answers."}], "correct": ["D"], "images": [], "number": 4, "explanation": "Đáp án này phù hợp nhất vì nội dung “All of the answers.” trực tiếp trả lời đúng trọng tâm của câu hỏi, trong khi các lựa chọn còn lại thuộc thời kỳ, nhân vật hoặc đặc trưng khác.", "keywords": ["Gaudi", "broken", "tiles", "well"]}, {"source": "HOD102 - BO SUNG FALL 24", "original_number": "5", "question": "Which of Haeckel's terms shows that everything in the natural world is interconnected? and his influence is notable in the 1890s work of the Belgian architect Victor Horta, who used vegetal forms that recalled the whirling life force found in Haeckel's lithographs, with all elements of his interiors united by a strong stylistic interrelationship, from the specially designed door handles to the custom-made furniture.", "options": [{"label": "A", "text": "biomimicry"}, {"label": "B", "text": "biology"}, {"label": "C", "text": "ecology"}, {"label": "D", "text": "naturalist"}], "correct": ["C"], "images": [], "number": 5, "explanation": "Victor Horta là đại diện Art Nouveau tại Bỉ; công trình của ông kết hợp kết cấu, nội thất và trang trí thành một Gesamtkunstwerk. Vì vậy lựa chọn đúng là “ecology”.", "keywords": ["Victor Horta", "Belgium", "Gesamtkunstwerk"]}, {"source": "HOD102 - BO SUNG FALL 24", "original_number": "6", "question": "What are the influences that contributed to the development of the Art Nouveau style?", "options": [{"label": "A", "text": "The Renaissance and Baroque movements"}, {"label": "B", "text": "The Rococo and Neoclassical movements"}, {"label": "C", "text": "The Aesthetic Movement and Symbolist movement"}, {"label": "D", "text": "The Impressionist and Cubist movements"}], "correct": ["C"], "images": [], "number": 6, "explanation": "Art Nouveau dùng đường cong uốn lượn, mô-típ thực vật, hoa lá và cảm hứng từ tự nhiên; ở Đức gọi là Jugendstil, ở Ý gọi là Stile Liberty. Vì vậy lựa chọn đúng là “The Aesthetic Movement and Symbolist movement”.", "keywords": ["Art Nouveau", "nature", "whiplash line"]}, {"source": "HOD102 - BO SUNG FALL 24", "original_number": "7", "question": "In which countries did the Art Nouveau style find its most sublime expression, featuring examples like Victor Horta's Gesamtkunstwerk architectural schemes and Hector Guimard's Paris Metro entrances?", "options": [{"label": "A", "text": "England and Germany"}, {"label": "B", "text": "France and Belgium"}, {"label": "C", "text": "Italy and Spain"}, {"label": "D", "text": "Austria and Hungary"}], "correct": ["C"], "images": [], "number": 7, "explanation": "Art Nouveau dùng đường cong uốn lượn, mô-típ thực vật, hoa lá và cảm hứng từ tự nhiên; ở Đức gọi là Jugendstil, ở Ý gọi là Stile Liberty. Vì vậy lựa chọn đúng là “Italy and Spain”.", "keywords": ["Art Nouveau", "nature", "whiplash line"]}, {"source": "HOD102 - BO SUNG FALL 24", "original_number": "8", "question": "What influenced the historical motifs and natural forms in the Art Nouveau style in France and Belgium?", "options": [{"label": "A", "text": "Greek and Roman architecture"}, {"label": "B", "text": "Japanese woodblock prints 4"}, {"label": "C", "text": "Christopher Dresser's botanical studies"}, {"label": "D", "text": "Gothic cathedrals and stained glass"}], "correct": ["D"], "images": [], "number": 8, "explanation": "Art Nouveau dùng đường cong uốn lượn, mô-típ thực vật, hoa lá và cảm hứng từ tự nhiên; ở Đức gọi là Jugendstil, ở Ý gọi là Stile Liberty. Vì vậy lựa chọn đúng là “Gothic cathedrals and stained glass”.", "keywords": ["Art Nouveau", "nature", "whiplash line"]}, {"source": "HOD102 - BO SUNG FALL 24", "original_number": "8", "question": "Who was a primary exponent of Art Nouveau in Belgium during the 1890s and later became a key figure in the formation of the Modern Movement in Germany?", "options": [{"label": "A", "text": "Victor Horta"}, {"label": "B", "text": "Paul Hankar"}, {"label": "C", "text": "Christopher Dresser"}, {"label": "D", "text": "Henry van de Velde"}], "correct": ["C"], "images": [], "number": 9, "explanation": "Art Nouveau dùng đường cong uốn lượn, mô-típ thực vật, hoa lá và cảm hứng từ tự nhiên; ở Đức gọi là Jugendstil, ở Ý gọi là Stile Liberty. Vì vậy lựa chọn đúng là “Christopher Dresser”.", "keywords": ["Art Nouveau", "nature", "whiplash line"]}, {"source": "HOD102 - BO SUNG FALL 24", "original_number": "10", "question": "What did Henry van de Velde emphasize in his design philosophy, as mentioned in his article \"Was ich will\" (What I want): \"No ornament can be permitted that is not organically absorbed .... I wish to replace old symbolic elements, which have lost their effectiveness for us today, with a new, imperishable beauty ... in which ornament has no life of its own but depends on the forms and lines of the object itself, from which it receives its proper organic place.\"", "options": [{"label": "A", "text": "The dominance of surface ornamentation"}, {"label": "B", "text": "The rejection of machine-made products"}, {"label": "C", "text": "The importance of organic absorption of ornament"}, {"label": "D", "text": "The separation of form and lines from ornament"}], "correct": ["B"], "images": [], "number": 10, "explanation": "Adolf Loos phản đối trang trí thừa vì nó làm lãng phí lao động, vật liệu, tiền bạc và cản trở tính hợp lý của thiết kế. Vì vậy lựa chọn đúng là “The rejection of machine-made products”.", "keywords": ["Adolf Loos", "ornament", "waste"]}, {"source": "HOD102 - BO SUNG FALL 24", "original_number": "11", "question": "This is the entrance to the Castel Beranger apartment, 1894-98. What style is the gate at this entrance? [file: Unit 8.1 _1_entrance to the Castel Beranger apartment.png]", "options": [{"label": "A", "text": "The Impressionist"}, {"label": "B", "text": "Art Nouveau"}, {"label": "C", "text": "Rococo"}, {"label": "D", "text": "Aesthetic Movement"}], "correct": ["A"], "images": ["images/011_5b91284c.jpg"], "number": 11, "explanation": "Đáp án này phù hợp nhất vì nội dung “The Impressionist” trực tiếp trả lời đúng trọng tâm của câu hỏi, trong khi các lựa chọn còn lại thuộc thời kỳ, nhân vật hoặc đặc trưng khác.", "keywords": ["entrance", "Castel", "Beranger", "apartment"]}, {"source": "HOD102 - BO SUNG FALL 24", "original_number": "12", "question": "Fill in the blank with CORRECT words: Although the Maison de ………became Paris's most stylish emporium for the New Art and there was much enthusiasm for Bing's boutique and the objets d'art it sold, some critics were disturbed by the style's abandonment of the eighteenth-century French decorative tradition", "options": [{"label": "A", "text": "L’Art Nouveau"}, {"label": "B", "text": "Liberty & Co"}, {"label": "C", "text": "None of these answer"}, {"label": "D", "text": "La Maison Moderne"}], "correct": ["A"], "images": [], "number": 12, "explanation": "Art Nouveau dùng đường cong uốn lượn, mô-típ thực vật, hoa lá và cảm hứng từ tự nhiên; ở Đức gọi là Jugendstil, ở Ý gọi là Stile Liberty. Vì vậy lựa chọn đúng là “L’Art Nouveau”.", "keywords": ["Art Nouveau", "nature", "whiplash line"]}, {"source": "HOD102 - BO SUNG FALL 24", "original_number": "13", "question": "Commenting on the store's opening in the Paris newspaper Le Figaro, the art critic Octave Mirbeau stated that \"All this smacks of the English lecher, the Jewish morphine addict or the Belgian rogue, or a nice salad of these three poisons. Which design style is mentioned in the comment above?", "options": [{"label": "A", "text": "Art Nouveau"}, {"label": "B", "text": "Pop art"}, {"label": "C", "text": "Punk"}, {"label": "D", "text": "Rococo"}], "correct": ["A"], "images": [], "number": 13, "explanation": "Art Nouveau dùng đường cong uốn lượn, mô-típ thực vật, hoa lá và cảm hứng từ tự nhiên; ở Đức gọi là Jugendstil, ở Ý gọi là Stile Liberty.", "keywords": ["Art Nouveau", "nature", "whiplash line"]}, {"source": "HOD102 - BO SUNG FALL 24", "original_number": "14", "question": "What term describes the approach adopted by about ten designers in 1901 when they founded the Ecole Nancy to reform design by using nature as a template?", "options": [{"label": "A", "text": "Industrialization"}, {"label": "B", "text": "Technological Innovation"}, {"label": "C", "text": "Environmentalism"}, {"label": "D", "text": "Biomimicry"}], "correct": ["D"], "images": [], "number": 14, "explanation": "Đáp án này phù hợp nhất vì nội dung “Biomimicry” trực tiếp trả lời đúng trọng tâm của câu hỏi, trong khi các lựa chọn còn lại thuộc thời kỳ, nhân vật hoặc đặc trưng khác.", "keywords": ["describes", "adopted", "designers", "1901"]}, {"source": "HOD102 - BO SUNG FALL 24", "original_number": "15", "question": "Which designer, notably recognized for his posters, frequently incorporated the poppy motif into Art Nouveau graphics during this period?", "options": [{"label": "A", "text": "Victor Horta"}, {"label": "B", "text": "Paul Hankar"}, {"label": "C", "text": "Louis Majorelle"}, {"label": "D", "text": "Alphonse Mucha"}], "correct": ["B"], "images": [], "number": 15, "explanation": "Art Nouveau dùng đường cong uốn lượn, mô-típ thự ": ["Constructivism", "geometry", "industry"]}, {"source": "FINAL HOD102 FALL 23", "original_number": "39", "question": "Where is the Slit tapestry (Red/Green) woven by Gunta Stölzl in 1927-1928? [file: Slit tapestry.jpg]", "options": [{"label": "A", "text": "Bauhaus Weaving Workshop"}, {"label": "B", "text": "State Porcelain Factory in Petrograd"}, {"label": "C", "text": "VkhUTEMAS - This art and technical institution, founded in Moscow in 1920"}, {"label": "D", "text": "Nome of the answer"}], "correct": ["A"], "images": ["images/040_8492a310.jpg"], "number": 155, "explanation": "Bauhaus hướng tới sự thống nhất giữa nghệ thuật, thủ công và công nghiệp, ưu tiên công năng, hình thức giản lược và sản xuất hiện đại. Vì vậy lựa chọn đúng là “Bauhaus Weaving Workshop”.", "keywords": ["Bauhaus", "function", "industry"]}, {"source": "FINAL HOD102 FALL 23", "original_number": "40", "question": "Fill in the blank: Gropius now believed that the industrial capitalism pioneered by ……………could actually benefit workers, and that it was the only approach that might ensure the Bauhaus's economic survival.", "options": [{"label": "A", "text": "Ludwig Mies van der Rodhe in the United States"}, {"label": "B", "text": "Hannes Meyer in Switzerland"}, {"label": "C", "text": "Henry Ford in the United States"}, {"label": "D", "text": "Thomas Edison in the United States"}], "correct": ["C"], "images": [], "number": 156, "explanation": "Bauhaus hướng tới sự thống nhất giữa nghệ thuật, thủ công và công nghiệp, ưu tiên công năng, hình thức giản lược và sản xuất hiện đại. Vì vậy lựa chọn đúng là “Henry Ford in the United States”.", "keywords": ["Bauhaus", "function", "industry"]}, {"source": "FINAL HOD102 FALL 23", "original_number": "41", "question": "What is the decorative style of this ceramic product? [file: Teapot.png]", "options": [{"label": "A", "text": "Constructivist"}, {"label": "B", "text": "Abstraction"}, {"label": "C", "text": "De Stijl"}, {"label": "D", "text": "Art Deco"}], "corre const Q=JSON.parse(document.getElementById('question-data').textContent);let i=0,done=false;const $=x=>document.getElementById(x);
function render(){const q=Q[i];done=false;$('progress').textContent=`Câu ${i+1} / ${Q.length}`;$('meta').textContent=`Nguồn: ${q.source} - Câu gốc: ${q.original_number}`;$('qtext').textContent=q.question;$('images').innerHTML='';(q.images||[]).forEach(src=>{const im=document.createElement('img');im.src=src;im.className='qimg';im.alt='Hình minh họa câu hỏi';$('images').appendChild(im)});$('opts').innerHTML='';q.options.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o.label+'. '+o.text;b.onclick=()=>check(o.label);$('opts').appendChild(b)});$('feedback').textContent='';$('feedback').className='feedback';$('study-note').className='study-note';$('explanation').textContent='';$('keywords').innerHTML='';$('prev').disabled=i===0;$('next').disabled=i===Q.length-1;$('jump').value=i+1}
function check(l){if(done)return;done=true;const q=Q[i],bs=[...document.querySelectorAll('.opt')];bs.forEach((b,k)=>{b.disabled=true;const ol=q.options[k].label;if(q.correct.includes(ol))b.classList.add('correct');if(ol===l&&!q.correct.includes(ol))b.classList.add('wrong')});if(q.correct.includes(l)){$('feedback').textContent='Đúng';$('feedback').classList.add('good')}else{$('feedback').textContent='Sai. Đáp án đúng: '+q.correct.join(', ');$('feedback').classList.add('bad')}$('explanation').textContent=q.explanation||'';$('keywords').innerHTML='';(q.keywords||[]).forEach(k=>{const span=document.createElement('span');span.className='keyword';span.textContent=k;$('keywords').appendChild(span)});$('study-note').className='study-note show'}
function go(n){if(n<0||n>=Q.length)return;i=n;render();scrollTo({top:0,behavior:'smooth'})}$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);$('reset').onclick=render;$('jump').onchange=e=>{const n=+e.target.value;if(Number.isInteger(n)&&n>=1&&n<=Q.length)go(n-1);else e.target.value=i+1};render();
</script></body></html>
